<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忘记密码 · 天猫数据 AI 分析平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-[#111827] font-sans text-slate-200">
  <div class="w-[420px] rounded-2xl border border-white/5 bg-[#1F2937] p-8 shadow-2xl shadow-black/40">
    <div class="mb-6 text-center">
      <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 to-cyan-400 text-xl font-bold text-white">猫</div>
      <h1 class="text-xl font-semibold text-white">忘记密码</h1>
      <p class="mt-1 text-xs leading-5 text-slate-500">请输入您的用户名以及注册时填写的邮箱或手机号以重置密码</p>
    </div>

    {% if error %}
    <p class="mb-4 rounded-lg bg-rose-500/10 px-3 py-2 text-sm text-rose-300">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/forget_password" class="space-y-4">
      <div>
        <label class="mb-1 block text-sm text-slate-400" for="username">用户名</label>
        <input id="username" name="username" type="text" required
               class="w-full rounded-lg border border-[#374151] bg-[#111827] px-3 py-2 text-sm text-slate-200 outline-none focus:border-indigo-400">
      </div>
      <div>
        <label class="mb-1 block text-sm text-slate-400" for="contact">注册邮箱或手机号</label>
        <input id="contact" name="contact" type="text" required placeholder="example@mail.com / 13800000000"
               class="w-full rounded-lg border border-[#374151] bg-[#111827] px-3 py-2 text-sm text-slate-200 outline-none focus:border-indigo-400">
      </div>
      <div>
        <label class="mb-1 block text-sm text-slate-400" for="new_password">新密码（至少 6 位）</label>
        <input id="new_password" name="new_password" type="password" required minlength="6"
               class="w-full rounded-lg border border-[#374151] bg-[#111827] px-3 py-2 text-sm text-slate-200 outline-none focus:border-indigo-400">
      </div>
      <div>
        <label class="mb-1 block text-sm text-slate-400" for="confirm_password">确认新密码</label>
        <input id="confirm_password" name="confirm_password" type="password" required minlength="6"
               class="w-full rounded-lg border border-[#374151] bg-[#111827] px-3 py-2 text-sm text-slate-200 outline-none focus:border-indigo-400">
      </div>
      <button type="submit"
              class="w-full rounded-lg bg-gradient-to-r from-indigo-500 to-cyan-500 py-2.5 text-sm font-semibold text-white transition hover:opacity-90">
        验证并重置密码
      </button>
    </form>

    <div class="mt-4 text-center text-sm text-slate-400">
      想起密码了？<a href="/login" class="text-indigo-400 transition hover:text-indigo-300">返回登录</a>
    </div>
    <p class="mt-3 text-center text-xs text-slate-500">重置后请妥善保管新密码，旧密码将立即失效</p>
  </div>
</body>
</html>
